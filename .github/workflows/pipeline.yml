# Reusable workflow. Each user's private data repository calls this once a week.
# The code is checked out from this public repository; data, secrets and commits
# stay in the caller's repository.
name: pipeline

on:
  workflow_call:
    inputs:
      code_ref:
        description: Branch or tag of research-dump to run
        type: string
        default: main
    secrets:
      S2_API_KEY:
        required: false
      OPENALEX_API_KEY:
        required: false
      GEMINI_API_KEY:
        required: false
      OPENROUTER_API_KEY:
        required: false
      TELEGRAM_BOT_TOKEN:
        required: false
      TELEGRAM_CHAT_ID:
        required: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
      CHECKPOINT: "1"
    permissions:
      contents: write
    steps:
      - name: Check out data (caller repository, latest)
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          path: data

      - name: Check out code (research-dump)
        uses: actions/checkout@v5
        with:
          repository: hanslelee/research-dump
          ref: ${{ inputs.code_ref }}
          path: code

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up git for checkpoints
        working-directory: data
        run: |
          git config user.name "research-dump bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # bundle.json is rebuilt at the end and the web page corrects stale entries, so either side may win
          printf 'bundle.json merge=keep\nembeddings/papers.json merge=keep\n' >> .git/info/attributes
          git config merge.keep.driver true

      - name: Update old data files to the current shape
        run: python code/pipeline/migrate.py --data data

      - name: Validate data
        run: python code/pipeline/validate.py data

      - name: Collect candidates
        continue-on-error: true
        timeout-minutes: 10
        env:
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python code/pipeline/collect.py --data data

      - name: Fill in missing abstracts
        continue-on-error: true
        timeout-minutes: 10
        env:
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
        run: python code/pipeline/enrich.py --data data

      - name: Screening agent
        continue-on-error: true
        timeout-minutes: 20
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python code/pipeline/screen.py --data data

      - name: Merge duplicate papers
        continue-on-error: true
        timeout-minutes: 5
        run: python code/pipeline/dedupe.py --data data

      - name: Venue, citations, affiliations
        continue-on-error: true
        timeout-minutes: 15
        env:
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python code/pipeline/metadata.py --data data

      - name: References of liked and ★ papers (베이스라인)
        continue-on-error: true
        timeout-minutes: 10
        env:
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
        run: python code/pipeline/refs.py --data data

      - name: Summary agent
        continue-on-error: true
        timeout-minutes: 25
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python code/pipeline/summarize.py --data data

      - name: Embeddings (for vector search)
        continue-on-error: true
        timeout-minutes: 10
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python code/pipeline/embed.py --data data

      - name: Compare agent (relations)
        continue-on-error: true
        timeout-minutes: 25
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python code/pipeline/compare.py --data data

      - name: Telegram notification
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python code/pipeline/notify.py --data data

      - name: Requests left over from the web page (safety net)
        continue-on-error: true
        timeout-minutes: 20
        env:
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          pip install --quiet pypdf
          python code/pipeline/requests_run.py --data data

      - name: Bundle all files for the web page
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python code/pipeline/bundle.py --data data

      - name: Commit changes to the data repository
        if: ${{ !cancelled() }}
        working-directory: data
        run: |
          git config user.name "research-dump bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -q -m "Weekly run $(date -u +%F)"
            for i in 1 2 3 4 5; do
              if git pull --rebase -q && git push -q; then echo "Saved"; exit 0; fi
              git rebase --abort 2>/dev/null || true
              sleep $((i * 5))
            done
            echo "::error::Could not save the results to the repository (push failed 5 times)"
            exit 1
          fi
