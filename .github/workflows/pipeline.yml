# Reusable workflow. Each user's private data repository calls this once a week.
# The code is checked out from this public repository; data, secrets and commits
# stay in the caller's repository.
name: pipeline

on:
  workflow_call:
    inputs:
      code_ref:
        description: Branch or tag of research-dump to run
        type: string
        default: main
    secrets:
      S2_API_KEY:
        required: false
      OPENALEX_API_KEY:
        required: false
      GEMINI_API_KEY:
        required: false
      OPENROUTER_API_KEY:
        required: false
      TELEGRAM_BOT_TOKEN:
        required: false
      TELEGRAM_CHAT_ID:
        required: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
    permissions:
      contents: write
    steps:
      - name: Check out data (caller repository)
        uses: actions/checkout@v5
        with:
          path: data

      - name: Check out code (research-dump)
        uses: actions/checkout@v5
        with:
          repository: hanslelee/research-dump
          ref: ${{ inputs.code_ref }}
          path: code

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate data
        run: python code/pipeline/validate.py data

      - name: Collect candidates
        continue-on-error: true
        timeout-minutes: 10
        env:
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python code/pipeline/collect.py --data data

      - name: Fill in missing abstracts
        continue-on-error: true
        timeout-minutes: 10
        env:
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
        run: python code/pipeline/enrich.py --data data

      - name: Screening agent
        continue-on-error: true
        timeout-minutes: 20
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python code/pipeline/screen.py --data data

      - name: Summary agent
        continue-on-error: true
        timeout-minutes: 25
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python code/pipeline/summarize.py --data data

      - name: Telegram notification
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python code/pipeline/notify.py --data data

      # Next: compare agent

      - name: Commit changes to the data repository
        if: ${{ !cancelled() }}
        working-directory: data
        run: |
          git config user.name "research-dump bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Weekly run $(date -u +%F)"
            git pull --rebase
            git push
          fi
